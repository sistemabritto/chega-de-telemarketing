name: Screenshot

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar (debug)
        run: gradle assembleDebug --no-daemon

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador + prints
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n br.com.chegadetelemarketing/.MainActivity
            sleep 6
            adb exec-out screencap -p > shot-1.png
            adb shell input swipe 540 1800 540 500 400
            sleep 2
            adb exec-out screencap -p > shot-2.png
            adb shell input swipe 540 1800 540 500 400
            sleep 2
            adb exec-out screencap -p > shot-3.png
            adb shell input swipe 540 1800 540 300 400
            sleep 2
            adb exec-out screencap -p > shot-4.png

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shot-*.png
